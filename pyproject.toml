[project]
name = "ai-news"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "feedparser>=6.0.12",
    "flask>=3.1.3",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "youtube-transcript-api>=1.2.4",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]